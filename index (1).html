<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<meta name="description" content="A little interactive birthday surprise for Muskan — blow out the candles, pop the balloons, make a wish.">
<meta name="theme-color" content="#FFE4EF">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Happy Birthday, Muskan!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FFE4EF;
    --dot: #FFD0E3;
    --ink: #5B2A57;
    --berry: #FF6FA5;
    --lav: #B9A4FF;
    --butter: #FFE27A;
    --mint: #9BEBD0;
    --sky: #8FD3FF;
    --white: #FFFFFF;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body {
    min-height: 100svh;
    background-color: var(--bg);
    background-image: radial-gradient(var(--dot) 3px, transparent 3.5px);
    background-size: 38px 38px;
    color: var(--ink);
    font-family: "Fredoka", "Trebuchet MS", system-ui, -apple-system, sans-serif;
    overflow-x: hidden;
    overscroll-behavior-y: contain;
    -webkit-user-select: none;
    user-select: none;
  }
  button, input { font: inherit; color: inherit; }
  button { touch-action: manipulation; -webkit-appearance: none; appearance: none; }
  :focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  main:focus { outline: none; }

  /* ---------- Gate (gift screen) ---------- */
  .gate {
    position: fixed; inset: 0; z-index: 50;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px;
    padding: calc(24px + env(safe-area-inset-top, 0px)) 24px calc(24px + env(safe-area-inset-bottom, 0px));
    text-align: center;
    background-color: var(--bg);
    background-image: radial-gradient(var(--dot) 3px, transparent 3.5px);
    background-size: 38px 38px;
    transition: opacity .5s ease;
  }
  .gate.gone { opacity: 0; pointer-events: none; }
  .gate-title {
    margin: 0;
    font-size: clamp(1.35rem, 5.5vw, 2.2rem);
    font-weight: 600;
    max-width: 20ch;
    line-height: 1.2;
  }
  .gift {
    width: min(58vw, 240px); background: none; border: 0; padding: 0; cursor: pointer;
    animation: wiggle 2.6s ease-in-out infinite;
  }
  .gift svg { width: 100%; height: auto; display: block; overflow: visible; }
  .gift .lid {
    transform-box: fill-box; transform-origin: center;
    transition: transform .6s cubic-bezier(.3,1.5,.5,1), opacity .6s ease;
  }
  .gate.opened .gift { animation: none; }
  .gate.opened .lid { transform: translateY(-60px) rotate(-16deg); opacity: 0; }
  @keyframes wiggle {
    0%, 70%, 100% { transform: rotate(0); }
    76% { transform: rotate(-5deg); }
    82% { transform: rotate(5deg); }
    88% { transform: rotate(-3deg); }
    94% { transform: rotate(3deg); }
  }

  /* ---------- Buttons ---------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    min-height: 44px;
    padding: 10px 20px;
    border-radius: 999px;
    cursor: pointer;
    background: var(--white);
    border: 3px solid var(--ink);
    box-shadow: 0 4px 0 var(--ink);
    font-weight: 600;
    font-size: 1rem;
    line-height: 1.2;
    transition: transform .08s ease, box-shadow .08s ease, opacity .2s ease;
    -webkit-appearance: none; appearance: none;
  }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 5px 0 var(--ink); }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
  .btn:disabled { opacity: .7; cursor: default; transform: none; box-shadow: 0 4px 0 var(--ink); }
  .btn.primary { background: var(--butter); }
  .btn.big { font-size: 1.2rem; padding: 12px 28px; }

  .sound {
    position: fixed; z-index: 20;
    top: calc(12px + env(safe-area-inset-top, 0px));
    right: calc(12px + env(safe-area-inset-right, 0px));
    padding: 8px 14px;
    font-size: .9rem;
    min-height: 40px;
  }
  .sound svg { width: 18px; height: 18px; }
  .sound[aria-pressed="false"] svg .wave { display: none; }

  /* ---------- Layout ---------- */
  main {
    position: relative; z-index: 2;
    display: flex; flex-direction: column; align-items: center; gap: 18px;
    padding:
      calc(60px + env(safe-area-inset-top, 0px))
      calc(16px + env(safe-area-inset-left, 0px))
      calc(40px + env(safe-area-inset-bottom, 0px))
      calc(16px + env(safe-area-inset-right, 0px));
    text-align: center;
    pointer-events: none;
  }
  main > * { pointer-events: auto; }

  h1 { margin: 0; line-height: 1; font-weight: 700; }
  .line { display: block; }
  .line.small { font-size: clamp(1.8rem, 8.5vw, 3.4rem); }
  .line.name { font-size: clamp(2.8rem, 16vw, 7rem); word-break: break-word; }
  .ch {
    display: inline-block; cursor: pointer; opacity: 0;
    -webkit-user-select: none; user-select: none;
    text-shadow:
      0 3px 0 #fff, 0 -2px 0 #fff, 2px 0 0 #fff, -2px 0 0 #fff,
      2px 2px 0 #fff, -2px -2px 0 #fff, 2px -2px 0 #fff, -2px 2px 0 #fff;
  }
  body.ready .ch { animation: drop .6s cubic-bezier(.3,1.6,.5,1) both; animation-delay: var(--d, 0s); }
  @keyframes drop {
    from { opacity: 0; transform: translateY(-50px) scale(.5) rotate(-12deg); }
    to   { opacity: 1; transform: none; }
  }

  /* ---------- Reveal on open ---------- */
  .reveal { opacity: 0; transform: translateY(20px); transition: opacity .6s ease, transform .6s cubic-bezier(.3,1.5,.5,1); }
  body.ready .reveal { opacity: 1; transform: none; }
  body.ready .reveal.d1 { transition-delay: .15s; }
  body.ready .reveal.d2 { transition-delay: .30s; }
  body.ready .reveal.d3 { transition-delay: .45s; }
  body.ready .reveal.d4 { transition-delay: .60s; }

  /* ---------- Polaroid photo ---------- */
  .polaroid {
    width: min(72vw, 250px);
    aspect-ratio: 1 / 1.18;
    perspective: 1100px;
    cursor: pointer;
    margin: 0;
    transform: rotate(-2deg);
    -webkit-tap-highlight-color: transparent;
  }
  .polaroid-flip {
    position: relative;
    width: 100%; height: 100%;
    transition: transform .8s cubic-bezier(.4,.2,.2,1);
    transform-style: preserve-3d;
    -webkit-transform-style: preserve-3d;
  }
  .polaroid.flipped .polaroid-flip { transform: rotateY(180deg); }
  .polaroid-face {
    position: absolute; inset: 0;
    -webkit-backface-visibility: hidden;
    backface-visibility: hidden;
    background: #fff;
    border: 3px solid var(--ink);
    border-radius: 12px;
    box-shadow: 6px 6px 0 var(--lav);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .polaroid-face.front { padding: 12px 12px 44px; }
  .polaroid-face.front img {
    flex: 1;
    min-height: 0;
    width: 100%;
    object-fit: cover;
    border-radius: 6px;
    border: 2px solid var(--ink);
    background: var(--bg);
    display: block;
  }
  .polaroid-face.front figcaption {
    position: absolute;
    left: 12px; right: 12px; bottom: 10px;
    text-align: center;
    font-weight: 600;
    font-size: .95rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .polaroid-face.back {
    transform: rotateY(180deg);
    background: var(--butter);
    padding: 22px;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  .polaroid-face.back p { margin: 0; font-size: 1.05rem; font-weight: 500; line-height: 1.4; }
  .polaroid-hint { margin: -8px 0 0; font-size: .8rem; opacity: .65; }

  /* ---------- Cake ---------- */
  .cake-wrap { width: min(88vw, 380px); }
  #cake { width: 100%; height: auto; display: block; overflow: visible; }
  .candle { cursor: pointer; outline: none; -webkit-tap-highlight-color: transparent; }
  .candle .hit { stroke: transparent; stroke-width: 3; }
  .candle:focus-visible .hit { stroke: var(--ink); stroke-dasharray: 6 5; }
  .flick {
    transform-box: fill-box; transform-origin: 50% 100%;
    animation: flicker .5s ease-in-out infinite alternate;
    transition: opacity .2s ease, transform .2s ease;
  }
  @keyframes flicker {
    from { transform: scale(1, 1) rotate(-3deg); }
    to   { transform: scale(.92, 1.1) rotate(3deg); }
  }
  .candle.out .flick { animation: none; opacity: 0; transform: scale(.2); }
  .puff { opacity: 0; fill: #fff; stroke: var(--ink); stroke-width: 2; }
  .candle.out .puff { animation: smoke 1.4s ease-out; }
  @keyframes smoke {
    0%   { opacity: .95; transform: translateY(0) scale(.6); }
    100% { opacity: 0; transform: translateY(-34px) scale(1.5); }
  }
  .eyes-happy, .mouth-big { display: none; }
  #cake.done .eyes-open, #cake.done .mouth-small { display: none; }
  #cake.done .eyes-happy, #cake.done .mouth-big { display: block; }

  .status { margin: 0; font-size: 1.1rem; font-weight: 500; min-height: 1.5em; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; max-width: 520px; }
  .row .btn { font-size: .95rem; padding: 9px 16px; }

  /* ---------- Notes / apology deck ---------- */
  .notes {
    width: min(92vw, 440px);
    background: var(--white);
    border: 3px solid var(--ink);
    border-radius: 24px;
    box-shadow: 6px 6px 0 var(--mint);
    padding: 20px 20px 16px;
    position: relative;
  }
  .notes h2 {
    margin: 0 0 12px;
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: .5px;
    text-transform: uppercase;
    color: var(--berry);
    opacity: .85;
  }
  .note-text {
    margin: 0 0 16px;
    min-height: 5em;
    font-size: 1.1rem;
    font-weight: 500;
    line-height: 1.5;
    transition: opacity .25s ease, transform .25s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 4px;
  }
  .note-text.fade { opacity: 0; transform: translateY(6px); }
  .note-nav { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .note-nav .btn { padding: 0; width: 42px; height: 42px; min-height: 42px; font-size: 1.5rem; font-weight: 700; line-height: 1; }
  .note-dots { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; max-width: 200px; }
  .note-dots i {
    display: block; width: 8px; height: 8px; border-radius: 50%;
    background: var(--ink); opacity: .25; transition: opacity .2s ease, transform .2s ease;
  }
  .note-dots i.on { opacity: 1; transform: scale(1.25); background: var(--berry); }

  /* ---------- Gift boxes ---------- */
  .gifts { width: min(92vw, 420px); }
  .gifts-hint { margin: 0 0 10px; font-size: .95rem; font-weight: 600; opacity: .85; }
  .gifts-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .gbox {
    aspect-ratio: 1;
    background: var(--white);
    border: 3px solid var(--ink);
    border-radius: 16px;
    box-shadow: 0 4px 0 var(--ink);
    cursor: pointer;
    font-size: 1.8rem;
    display: flex; align-items: center; justify-content: center;
    transition: transform .15s ease, box-shadow .15s ease, background .3s ease;
    padding: 0; overflow: hidden;
  }
  .gbox:hover { transform: translateY(-2px); box-shadow: 0 6px 0 var(--ink); }
  .gbox:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
  .gbox.opened {
    background: var(--butter);
    cursor: default;
    font-size: 1.3rem;
    padding: 6px;
    text-align: center;
    line-height: 1.15;
    animation: pop .4s cubic-bezier(.3,1.7,.5,1);
  }
  .gbox.opened:hover { transform: none; box-shadow: 0 4px 0 var(--ink); }
  @keyframes pop {
    0% { transform: scale(.7); }
    60% { transform: scale(1.08); }
    100% { transform: scale(1); }
  }
  .gbox-note { font-size: .72rem; font-weight: 600; }

  /* ---------- Wish card ---------- */
  .wish {
    max-width: 420px;
    width: 100%;
    padding: 18px 22px 20px;
    background: var(--white);
    border: 3px solid var(--ink);
    border-radius: 26px;
    box-shadow: 7px 7px 0 var(--lav);
    transform: rotate(-1.5deg);
  }
  .wish h2 { margin: 0 0 6px; font-size: 1.55rem; font-weight: 700; }
  .wish p { margin: 0; font-size: 1.05rem; line-height: 1.45; }
  .wish .sign { margin-top: 10px; font-weight: 600; color: #E8478A; }
  .wish-input { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .wish-input input {
    flex: 1; min-width: 160px;
    padding: 10px 16px;
    border-radius: 999px;
    background: var(--bg);
    border: 3px solid var(--ink);
    text-align: center;
    font-weight: 500;
  }
  .wish-saved {
    margin-top: 10px !important;
    padding: 8px 14px;
    background: var(--bg);
    border-radius: 14px;
    font-size: .95rem !important;
    font-weight: 600;
    color: var(--berry);
  }

  .tiny { margin: 0; font-size: .9rem; opacity: .8; padding: 0 8px; }

  /* ---------- Balloons ---------- */
  .sky { position: fixed; inset: 0; z-index: 1; overflow: hidden; pointer-events: none; }
  .balloon {
    position: absolute; bottom: -190px; pointer-events: auto; cursor: pointer;
    animation: rise linear infinite;
  }
  @keyframes rise {
    from { transform: translateY(0); }
    to   { transform: translateY(calc(-100vh - 380px)); }
  }
  .sway {
    display: block; position: relative;
    animation: sway 4.5s ease-in-out infinite alternate;
    transform-origin: 50% 100%;
  }
  @keyframes sway {
    from { transform: translateX(-14px) rotate(-4deg); }
    to   { transform: translateX(14px) rotate(4deg); }
  }
  .bbody {
    display: block; position: relative;
    width: var(--s); height: calc(var(--s) * 1.2);
    background: var(--c);
    border: 3px solid var(--ink);
    border-radius: 50% 50% 46% 46%;
    box-shadow: inset -8px -10px 0 rgba(91, 42, 87, .12);
  }
  .bbody::before {
    content: ""; position: absolute;
    top: 14%; left: 20%; width: 18%; height: 26%;
    background: rgba(255,255,255,.75);
    border-radius: 50%;
    transform: rotate(25deg);
  }
  .bbody::after {
    content: ""; position: absolute;
    left: 50%; bottom: -9px; width: 12px; height: 12px;
    background: var(--c);
    border: 3px solid var(--ink);
    border-top: 0; border-left: 0;
    transform: translateX(-50%) rotate(45deg) scale(.8);
  }
  .sway::after {
    content: ""; display: block;
    width: 2px; height: 70px; margin: 8px auto 0;
    background: var(--ink); opacity: .6;
  }

  /* ---------- Confetti + hearts ---------- */
  #confetti { position: fixed; inset: 0; z-index: 40; pointer-events: none; }
  .heart {
    position: fixed; z-index: 45; pointer-events: none;
    font-size: 24px; line-height: 1;
    font-family: system-ui, sans-serif;
    font-variant-emoji: text;
    animation: floatUp 1.3s ease-out forwards;
  }
  @keyframes floatUp {
    from { opacity: 1; transform: translate(-50%, -50%) scale(.6); }
    to   { opacity: 0; transform: translate(calc(-50% + var(--dx)), calc(-50% - 100px)) scale(1.3); }
  }

  /* ---------- Small phones ---------- */
  @media (max-width: 360px) {
    .btn { padding: 9px 14px; font-size: .9rem; }
    .btn.big { padding: 11px 22px; font-size: 1.1rem; }
    .row .btn { font-size: .85rem; padding: 8px 12px; }
    .status { font-size: 1rem; }
    .wish { padding: 16px 18px; }
    .wish h2 { font-size: 1.35rem; }
    .gbox { font-size: 1.5rem; border-radius: 12px; }
    .gbox-note { font-size: .62rem; }
    .note-text { font-size: 1rem; min-height: 5.4em; }
    .note-dots i { width: 7px; height: 7px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .gift, .flick, .sway { animation: none; }
    .ch { opacity: 1 !important; animation: none !important; }
    .balloon { animation: none; bottom: auto; top: var(--rest, 30%); }
    .candle.out .puff { animation: none; }
    .reveal { opacity: 1 !important; transform: none !important; transition: none !important; }
    .polaroid-flip { transition: none !important; }
  }
</style>
</head>
<body>

<!-- Gift screen: the tap that opens it also unlocks the music -->
<div class="gate" id="gate">
  <button class="gift" id="giftBtn" type="button" aria-label="Open the gift">
    <svg viewBox="0 0 200 200" aria-hidden="true">
      <ellipse cx="100" cy="192" rx="78" ry="8" fill="#5B2A57" opacity=".15"/>
      <rect x="34" y="96" width="132" height="92" rx="10" fill="#B9A4FF" stroke="#5B2A57" stroke-width="4"/>
      <rect x="88" y="96" width="24" height="92" fill="#FFE27A" stroke="#5B2A57" stroke-width="3"/>
      <circle cx="62" cy="132" r="4" fill="#fff" opacity=".7"/>
      <circle cx="140" cy="158" r="4" fill="#fff" opacity=".7"/>
      <g class="lid">
        <rect x="24" y="66" width="152" height="36" rx="10" fill="#FF8FBA" stroke="#5B2A57" stroke-width="4"/>
        <rect x="88" y="66" width="24" height="36" fill="#FFE27A" stroke="#5B2A57" stroke-width="3"/>
        <ellipse cx="76" cy="54" rx="22" ry="13" transform="rotate(-22 76 54)" fill="#FFE27A" stroke="#5B2A57" stroke-width="3.5"/>
        <ellipse cx="124" cy="54" rx="22" ry="13" transform="rotate(22 124 54)" fill="#FFE27A" stroke="#5B2A57" stroke-width="3.5"/>
        <circle cx="100" cy="62" r="9" fill="#FFE27A" stroke="#5B2A57" stroke-width="3.5"/>
      </g>
    </svg>
  </button>
  <p class="gate-title" id="gateTitle">A little surprise is waiting for Muskan</p>
  <button class="btn primary big" id="openBtn" type="button">Open the gift</button>
</div>

<div class="sky" id="sky" aria-hidden="true"></div>
<canvas id="confetti" aria-hidden="true"></canvas>

<button class="btn sound" id="soundBtn" type="button" aria-pressed="true">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/>
    <path class="wave" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/>
  </svg>
  <span id="soundLabel">Sound on</span>
</button>

<main id="main" tabindex="-1">
  <h1 id="title" aria-label="Happy Birthday, Muskan">
    <span class="line small" id="line1" aria-hidden="true"></span>
    <span class="line name" id="line2" aria-hidden="true"></span>
  </h1>

  <figure class="polaroid reveal d1" id="polaroid" hidden tabindex="0" role="button"
          aria-label="Tap to flip the photo and read a message">
    <div class="polaroid-flip">
      <div class="polaroid-face front">
        <img id="photoImg" alt="A photo of Muskan" loading="lazy" decoding="async">
        <figcaption id="photoCap"></figcaption>
      </div>
      <div class="polaroid-face back">
        <p id="photoBack"></p>
      </div>
    </div>
  </figure>
  <p class="polaroid-hint reveal d1" id="polaroidHint" hidden>tap the photo 👆</p>

  <div class="cake-wrap reveal d2">
    <svg id="cake" viewBox="0 0 320 300" role="group" aria-label="A birthday cake with three candles">
      <ellipse cx="160" cy="278" rx="144" ry="14" fill="#fff" stroke="#5B2A57" stroke-width="3"/>
      <rect x="40" y="172" width="240" height="98" rx="20" fill="#FFB3D1" stroke="#5B2A57" stroke-width="3"/>
      <path d="M36 184 Q36 166 54 166 H266 Q284 166 284 184
               a24.8 24 0 0 1 -49.6 0 a24.8 14 0 0 1 -49.6 0 a24.8 24 0 0 1 -49.6 0 a24.8 14 0 0 1 -49.6 0 a24.8 24 0 0 1 -49.6 0 Z"
            fill="#fff" stroke="#5B2A57" stroke-width="3" stroke-linejoin="round"/>
      <g stroke="#5B2A57" stroke-width="1.5">
        <rect x="58" y="226" width="12" height="5" rx="2.5" fill="#FFE27A" transform="rotate(-25 64 228)"/>
        <rect x="72" y="248" width="12" height="5" rx="2.5" fill="#8FD3FF" transform="rotate(30 78 250)"/>
        <rect x="246" y="230" width="12" height="5" rx="2.5" fill="#9BEBD0" transform="rotate(20 252 232)"/>
        <rect x="232" y="254" width="12" height="5" rx="2.5" fill="#FFE27A" transform="rotate(-35 238 256)"/>
        <rect x="52" y="256" width="12" height="5" rx="2.5" fill="#B9A4FF" transform="rotate(10 58 258)"/>
        <rect x="258" y="250" width="12" height="5" rx="2.5" fill="#8FD3FF" transform="rotate(-15 264 252)"/>
      </g>
      <g>
        <g class="eyes-open">
          <circle cx="128" cy="234" r="6" fill="#5B2A57"/><circle cx="126" cy="232" r="2" fill="#fff"/>
          <circle cx="192" cy="234" r="6" fill="#5B2A57"/><circle cx="190" cy="232" r="2" fill="#fff"/>
        </g>
        <g class="eyes-happy" fill="none" stroke="#5B2A57" stroke-width="3.5" stroke-linecap="round">
          <path d="M120 238 q8 -12 16 0"/><path d="M184 238 q8 -12 16 0"/>
        </g>
        <ellipse cx="106" cy="248" rx="10" ry="6" fill="#FF6FA5" opacity=".55"/>
        <ellipse cx="214" cy="248" rx="10" ry="6" fill="#FF6FA5" opacity=".55"/>

<script>
/* ================= EDIT ME ================= */
const CONFIG = {
  name: "Muskan",
  message: "Another year older, another year more wonderful. I hope your day is full of cake, laughter, and everything you love most.",
  from: "",              // e.g. "Riya" -> shows "With love, Riya"

  /* ---------- Optional extras ---------- */
  photo: "",             // e.g. "muskan.jpg" (same folder as this file). Leave "" to hide the polaroid.
  photoCaption: "Muskan ✨",
  photoBack: "You make every day brighter. 💛",

  notesTitle: "For you, Muskan",

  /* 6 cards: 3 Islamic wishes + 3 straight apologies.
     Add or remove freely — arrows & dots auto-adjust. */
  notes: [
    "May Allah bless your new year with happiness, good health, and peace.",
    "May Allah grant you every good thing you've been quietly praying for.",
    "I'm sorry I didn't understand you the way I should have.",
    "May Allah fill your days with barakah and keep you smiling always.",
    "I'm deeply sorry for everything. I ask Allah to heal any pain I may have caused and bless your journey ahead with love and joy. ",
  ],

  gifts: [
    { emoji: "🎁", note: "A great big hug" },
    { emoji: "🍰", note: "A whole cake, just for you" },
    { emoji: "✨", note: "A whole year of good luck" },
    { emoji: "💝", note: "Endless love & laughter" }
  ]
};
/* URL can still override `from` / `msg`, e.g. birthday.html?from=Aman&msg=Happy%20birthday! */
/* =========================================== */

const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

const params       = new URLSearchParams(location.search);
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

if (params.get("from")) CONFIG.from    = params.get("from").slice(0, 30);
if (params.get("msg"))  CONFIG.message = params.get("msg").slice(0, 300);

const LETTER_COLORS   = ["#E8478A", "#7C5CF0", "#F07A2E", "#1FAE86", "#2E9BE8"];
const CONFETTI_COLORS = ["#FF6FA5", "#B9A4FF", "#FFE27A", "#9BEBD0", "#8FD3FF", "#FFA24D", "#FFFFFF"];
const BALLOON_COLORS  = ["#FF6FA5", "#B9A4FF", "#FFE27A", "#9BEBD0", "#8FD3FF", "#FFA24D"];
const SCALE           = [72, 74, 76, 79, 81, 84, 86];

/* ---------------- Heading letters ---------------- */
function splitLetters(el, text, offset) {
  el.textContent = "";
  [...text].forEach((c, i) => {
    const s = document.createElement("span");
    s.className = "ch";
    s.textContent = c === " " ? "\u00A0" : c;
    s.style.color = LETTER_COLORS[(i + offset) % LETTER_COLORS.length];
    s.style.setProperty("--d", ((i + offset) * 0.035) + "s");
    s.dataset.n = String(i + offset);
    el.appendChild(s);
  });
}
function renderHeading() {
  splitLetters($("#line1"), "Happy Birthday", 0);
  splitLetters($("#line2"), CONFIG.name + "!", 14);
  $("#title").setAttribute("aria-label", "Happy Birthday, " + CONFIG.name);
}
function hop(el) {
  if (reduceMotion || !el.animate) return;
  el.animate(
    [{ transform: "translateY(0) rotate(0)" },
     { transform: "translateY(-16px) rotate(-8deg)" },
     { transform: "translateY(0) rotate(0)" }],
    { duration: 450, easing: "ease-out" }
  );
}
function letterPlay(el) {
  hop(el);
  if (audioReady()) {
    pluck(SCALE[Number(el.dataset.n) % SCALE.length], ctx.currentTime, 0.9, 0.3, "triangle", sfxBus);
  }
}
$("#title").addEventListener("pointerover", (e) => {
  const ch = e.target.closest(".ch");
  if (ch && e.pointerType === "mouse" && !ch.contains(e.relatedTarget)) letterPlay(ch);
});
$("#title").addEventListener("pointerdown", (e) => {
  const ch = e.target.closest(".ch");
  if (ch && e.pointerType !== "mouse") letterPlay(ch);
});

/* ---------------- Audio (all synthesized, no files needed) ---------------- */
let ctx = null, master = null, musicBus = null, sfxBus = null, noiseBuf = null;
let soundOn = true, loopTimer = null;

function initAudio() {
  if (ctx) { if (ctx.state === "suspended") ctx.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  ctx = new AC();
  master   = ctx.createGain(); master.gain.value   = 0.9;  master.connect(ctx.destination);
  musicBus = ctx.createGain(); musicBus.gain.value = 0.55; musicBus.connect(master);
  sfxBus   = ctx.createGain(); sfxBus.gain.value   = 1;    sfxBus.connect(master);
  noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
}
function audioReady() { return !!ctx && ctx.state !== "closed"; }

function pluck(midi, t, dur, vol, type, bus) {
  const f  = 440 * Math.pow(2, (midi - 69) / 12);
  const o1 = ctx.createOscillator(), o2 = ctx.createOscillator();
  const g  = ctx.createGain(),       g2 = ctx.createGain();
  o1.type = type || "sine"; o1.frequency.value = f;
  o2.type = "sine";         o2.frequency.value = f * 2; g2.gain.value = 0.25;
  o1.connect(g); o2.connect(g2); g2.connect(g); g.connect(bus || musicBus);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o1.start(t); o2.start(t); o1.stop(t + dur + 0.05); o2.stop(t + dur + 0.05);
}

const MELODY = [
  [67,.75],[67,.25],[69,1],[67,1],[72,1],[71,2],
  [67,.75],[67,.25],[69,1],[67,1],[74,1],[72,2],
  [67,.75],[67,.25],[79,1],[76,1],[72,1],[71,1],[69,1],
  [77,.75],[77,.25],[76,1],[72,1],[74,1],[72,2]
];
const CHORDS = { C: [48, 52, 55], G: [43, 59, 62], F: [41, 57, 60] };
const BARS   = ["C", "G", "G", "C", "C", "F", "G", "C"];
const BEAT   = 0.56;

function scheduleSong(t0) {
  let t = t0;
  MELODY.forEach(([m, b]) => {
    pluck(m, t, Math.max(b * BEAT * 1.7, 0.45), 0.24, "triangle", musicBus);
    t += b * BEAT;
  });
  BARS.forEach((name, i) => {
    const bt = t0 + (1 + i * 3) * BEAT;
    const [bass, c1, c2] = CHORDS[name];
    pluck(bass, bt,             1.5, 0.2, "sine", musicBus);
    pluck(c1,   bt + BEAT,      0.8, 0.1, "sine", musicBus);
    pluck(c2,   bt + BEAT * 2,  0.8, 0.1, "sine", musicBus);
  });
  return (25 + 3) * BEAT;
}
function startMusic() {
  if (!audioReady() || loopTimer || ctx.state !== "running") return;
  const run = () => {
    if (!audioReady() || ctx.state !== "running") return;
    const len = scheduleSong(ctx.currentTime + 0.08);
    loopTimer = setTimeout(run, len * 1000);
  };
  run();
}
function stopMusic() {
  if (loopTimer) { clearTimeout(loopTimer); loopTimer = null; }
}
function setSound(on) {
  soundOn = on;
  $("#soundBtn").setAttribute("aria-pressed", String(on));
  $("#soundLabel").textContent = on ? "Sound on" : "Sound off";
  if (audioReady()) master.gain.setTargetAtTime(on ? 0.9 : 0, ctx.currentTime, 0.05);
  if (on) startMusic(); else stopMusic();
}
document.addEventListener("visibilitychange", () => {
  if (!ctx) return;
  if (document.hidden) {
    stopMusic();
    if (ctx.state === "running") ctx.suspend();
  } else {
    ctx.resume().then(() => { if (soundOn) startMusic(); });
  }
});
function noise(t, dur, type, freq, vol) {
  const src = ctx.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
  const f = ctx.createBiquadFilter();   f.type = type; f.frequency.value = freq;
  const g = ctx.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(f); f.connect(g); g.connect(sfxBus);
  src.start(t); src.stop(t + dur + 0.05);
}
function sfxPop() {
  if (!audioReady()) return;
  const t = ctx.currentTime;
  noise(t, 0.12, "highpass", 1800, 0.7);
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = "sine";
  o.frequency.setValueAtTime(520, t);
  o.frequency.exponentialRampToValueAtTime(120, t + 0.12);
  g.gain.setValueAtTime(0.35, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.14);
  o.connect(g); g.connect(sfxBus); o.start(t); o.stop(t + 0.16);
}
function sfxBlow() {
  if (!audioReady()) return;
  noise(ctx.currentTime, 0.45, "lowpass", 900, 0.5);
}
function sfxFanfare() {
  if (!audioReady()) return;
  const t = ctx.currentTime;
  [72, 76, 79, 84, 88].forEach((m, i) => pluck(m, t + i * 0.1, 0.9, 0.3, "triangle", sfxBus));
}
function sfxPopper() {
  if (!audioReady()) return;
  const t = ctx.currentTime;
  noise(t, 0.18, "bandpass", 1200, 0.8);
  pluck(88, t + 0.05, 0.5, 0.2, "triangle", sfxBus);
}

/* ---------------- Confetti ---------------- */
const cv = $("#confetti"), cx = cv.getContext("2d");
let parts = [], raf = 0, viewW = 0, viewH = 0;

function sizeCanvas() {
  viewW = window.innerWidth;
  viewH = window.innerHeight;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width  = Math.round(viewW * dpr);
  cv.height = Math.round(viewH * dpr);
  cv.style.width  = viewW + "px";
  cv.style.height = viewH + "px";
  cx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
sizeCanvas();
addEventListener("resize", sizeCanvas);
addEventListener("orientationchange", () => setTimeout(sizeCanvas, 250));

function burst(x, y, n, opts) {
  opts = opts || {};
  const angle  = opts.angle  !== undefined ? opts.angle  : -Math.PI / 2;
  const spread = opts.spread !== undefined ? opts.spread : Math.PI * 1.1;
  const colors = opts.colors || CONFETTI_COLORS;
  const count  = reduceMotion ? Math.round(n * 0.3) : n;
  for (let i = 0; i < count; i++) {
    const a = angle + (Math.random() - 0.5) * spread;
    const v = 5 + Math.random() * 9;
    parts.push({
      x, y,
      vx: Math.cos(a) * v, vy: Math.sin(a) * v,
      w: 6 + Math.random() * 7, h: 4 + Math.random() * 6,
      rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.4,
      color: colors[(Math.random() * colors.length) | 0],
      round: Math.random() < 0.3,
      life: 110 + Math.random() * 60
    });
  }
  if (!raf) raf = requestAnimationFrame(tick);
}
function tick() {
  cx.clearRect(0, 0, viewW, viewH);
  let n = 0;
  for (let i = 0; i < parts.length; i++) {
    const p = parts[i];
    p.vy += 0.2; p.vx *= 0.985; p.vy *= 0.985;
    p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life--;
    if (p.life <= 0 || p.y > viewH + 40 || p.x < -60 || p.x > viewW + 60) continue;
    parts[n++] = p;
    cx.save();
    cx.globalAlpha = Math.min(1, p.life / 30);
    cx.translate(p.x, p.y);
    cx.rotate(p.rot);
    cx.fillStyle = p.color;
    if (p.round) { cx.beginPath(); cx.arc(0, 0, p.w / 2, 0, 6.28); cx.fill(); }
    else cx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
    cx.restore();
  }
  parts.length = n;
  raf = parts.length ? requestAnimationFrame(tick) : 0;
}

/* ---------------- Balloons ---------------- */
const sky = $("#sky");
function makeBalloon(initial) {
  const b = document.createElement("div");
  b.className = "balloon";
  const color = BALLOON_COLORS[(Math.random() * BALLOON_COLORS.length) | 0];
  const size  = 58 + Math.random() * 32;
  const dur   = 15 + Math.random() * 11;
  b.dataset.color = color;
  b.style.setProperty("--c", color);
  b.style.setProperty("--s", size + "px");
  b.style.left = (3 + Math.random() * 86) + "%";
  b.style.setProperty("--rest", (8 + Math.random() * 60) + "%");
  b.style.animationDuration = dur + "s";
  b.style.animationDelay    = initial ? (-Math.random() * dur) + "s" : (Math.random() * 2) + "s";

  const sway = document.createElement("span");
  sway.className = "sway";
  sway.style.animationDuration = (3.5 + Math.random() * 2.5) + "s";
  const body = document.createElement("span");
  body.className = "bbody";
  sway.appendChild(body);
  b.appendChild(sway);
  sky.appendChild(b);
}
function spawnBalloons() {
  const n = window.innerWidth < 600 ? 6 : 9;
  for (let i = 0; i < n; i++) makeBalloon(true);
}
sky.addEventListener("pointerdown", (e) => {
  const b = e.target.closest(".balloon");
  if (!b) return;
  e.preventDefault();
  const r = b.getBoundingClientRect();
  const color = b.dataset.color;
  burst(r.left + r.width / 2, r.top + r.height * 0.35, 36,
        { spread: Math.PI * 2, colors: [color, "#fff", "#FFE27A"] });
  sfxPop();
  if (audioReady()) {
    pluck(SCALE[(Math.random() * SCALE.length) | 0], ctx.currentTime + 0.04, 0.7, 0.2, "triangle", sfxBus);
  }
  b.remove();
  setTimeout(() => makeBalloon(false), 900);
}, { passive: false });

/* ---------------- Cake + candles ---------------- */
const cake      = $("#cake");
const candles   = $$(".candle");
const statusEl  = $("#status");
const cakeWrap  = $(".cake-wrap");
let celebrated  = false;

function setCandleLabel(c, out) {
  const n = Number(c.dataset.i) + 1;
  c.setAttribute("aria-label",
    out ? "Candle " + n + ", blown out"
        : "Candle " + n + ", lit. Press to blow it out");
}
function cakeBounce() {
  if (reduceMotion || !cakeWrap.animate) return;
  cakeWrap.animate(
    [{ transform: "scale(1)" }, { transform: "scale(1.03)" }, { transform: "scale(1)" }],
    { duration: 380, easing: "ease-out" }
  );
}
function blow(c) {
  if (c.classList.contains("out")) return;
  c.classList.add("out");
  setCandleLabel(c, true);
  sfxBlow();
  cakeBounce();
  refresh();
}
function refresh() {
  const lit = candles.filter((c) => !c.classList.contains("out")).length;
  if (lit === 0) {
    if (!celebrated) { celebrated = true; celebrate(); }
  } else {
    celebrated = false;
    cake.classList.remove("done");
    $("#wish").hidden = true;
    statusEl.textContent = lit === 3
      ? "Tap each candle to blow it out"
      : lit + (lit === 1 ? " candle left" : " candles left");
  }
}
function celebrate() {
  cake.classList.add("done");
  statusEl.textContent = "All out! Make a wish.";
  sfxFanfare();
  burst(viewW * 0.5, viewH * 0.35, 120, { spread: Math.PI * 2 });
  burst(0, viewH, 70, { angle: -Math.PI / 3,     spread: Math.PI / 3 });
  burst(viewW, viewH, 70, { angle: -2 * Math.PI / 3, spread: Math.PI / 3 });
  const wish = $("#wish");
  wish.hidden = false;
  if (!reduceMotion && wish.animate) {
    wish.animate(
      [{ opacity: 0, transform: "translateY(24px) rotate(-1.5deg) scale(.9)" },
       { opacity: 1, transform: "translateY(0) rotate(-1.5deg) scale(1)" }],
      { duration: 450, easing: "cubic-bezier(.3,1.5,.5,1)" }
    );
  }
  wish.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "nearest" });
}
candles.forEach((c) => {
  c.addEventListener("click", () => blow(c));
  c.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); blow(c); }
  });
});
function blowAll() {
  candles.filter((c) => !c.classList.contains("out"))
         .forEach((c, i) => setTimeout(() => blow(c), i * 220));
}
$("#blowAll").addEventListener("click", blowAll);
$("#relight").addEventListener("click", () => {
  candles.forEach((c) => { c.classList.remove("out"); setCandleLabel(c, false); });
  refresh();
});
$("#popper").addEventListener("click", () => {
  sfxPopper();
  burst(viewW * 0.1, viewH * 0.95, 60, { angle: -Math.PI / 3,     spread: Math.PI / 3 });
  burst(viewW * 0.9, viewH * 0.95, 60, { angle: -2 * Math.PI / 3, spread: Math.PI / 3 });
});

/* ---------------- 🎤 Blow into mic ---------------- */
let micActive = false;
async function micBlow() {
  if (micActive) return;
  const btn = $("#micBlow");

  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    btn.textContent = "🎤 Not supported";
    setTimeout(() => { btn.textContent = "🎤 Blow into mic"; }, 1800);
    return;
  }
  if (!window.isSecureContext) {
    btn.textContent = "🎤 Needs HTTPS";
    setTimeout(() => { btn.textContent = "🎤 Blow into mic"; }, 2200);
    return;
  }

  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    initAudio();
    if (ctx.state === "suspended") await ctx.resume();

    const source   = ctx.createMediaStreamSource(stream);
    const analyser = ctx.createAnalyser();
    analyser.fftSize = 1024;
    analyser.smoothingTimeConstant = 0.5;
    source.connect(analyser);

    const data = new Uint8Array(analyser.frequencyBinCount);
    micActive = true;
    btn.disabled = true;
    btn.textContent = "🎤 Listening… blow!";

    let rafId = 0, fired = false;
    const LOW_BINS = Math.floor(data.length * 0.15);
    const THRESH   = 75;
    const started  = performance.now();

    const stop = () => {
      if (rafId) cancelAnimationFrame(rafId);
      stream.getTracks().forEach((t) => t.stop());
      micActive = false;
      btn.disabled = false;
      btn.textContent = "🎤 Blow into mic";
    };

    const check = () => {
      if (performance.now() - started > 10000) { stop(); return; }
      analyser.getByteFrequencyData(data);
      let sum = 0;
      for (let i = 0; i < LOW_BINS; i++) sum += data[i];
      const avg = sum / LOW_BINS;
      if (avg > THRESH && !fired) {
        fired = true;
        blowAll();
        stop();
        return;
      }
      rafId = requestAnimationFrame(check);
    };
    check();
  } catch (err) {
    $("#micBlow").textContent = "🎤 Mic blocked";
    setTimeout(() => { $("#micBlow").textContent = "🎤 Blow into mic"; }, 2000);
  }
}
$("#micBlow").addEventListener("click", micBlow);

/* ---------------- Hearts on tap ---------------- */
const HEART_COLORS = ["#E8478A", "#7C5CF0", "#F07A2E", "#1FAE86", "#2E9BE8"];
document.addEventListener("pointerdown", (e) => {
  if (reduceMotion || !document.body.classList.contains("ready")) return;
  if (e.target.closest("button, input, label, .candle, .balloon, .ch, .wish, .gate, .polaroid, .gbox, .notes")) return;
  const h = document.createElement("span");
  h.className = "heart";
  h.textContent = "\u2665";
  h.style.left  = e.clientX + "px";
  h.style.top   = e.clientY + "px";
  h.style.color = HEART_COLORS[(Math.random() * HEART_COLORS.length) | 0];
  h.style.setProperty("--dx", ((Math.random() - 0.5) * 60) + "px");
  document.body.appendChild(h);
  h.addEventListener("animationend", () => h.remove());
  if (audioReady()) {
    pluck(SCALE[(Math.random() * SCALE.length) | 0] + 12, ctx.currentTime, 0.5, 0.12, "sine", sfxBus);
  }
});

/* ---------------- Gift gate + sound toggle ---------------- */
let opened = false;
function openGift() {
  if (opened) return;
  opened = true;
  initAudio();
  setSound(true);
  $("#gate").classList.add("opened");
  sfxFanfare();
  burst(viewW / 2, viewH * 0.5, 130, { spread: Math.PI * 2 });
  setTimeout(() => {
    const gate = $("#gate");
    gate.classList.add("gone");
    document.body.classList.add("ready");
    $("#main").focus({ preventScroll: true });
    setTimeout(() => { gate.hidden = true; }, 600);
  }, reduceMotion ? 0 : 900);
}
$("#openBtn").addEventListener("click", openGift);
$("#giftBtn").addEventListener("click", openGift);
$("#soundBtn").addEventListener("click", () => {
  if (!audioReady()) initAudio();
  setSound(!soundOn);
});

/* ---------------- Polaroid photo ---------------- */
(function initPolaroid() {
  if (!CONFIG.photo) return;
  const fig   = $("#polaroid");
  const hint  = $("#polaroidHint");
  const img   = $("#photoImg");
  const cap   = $("#photoCap");
  const back  = $("#photoBack");

  img.src = CONFIG.photo;
  img.onerror = () => {
    fig.hidden = true;
    hint.hidden = true;
  };
  cap.textContent  = CONFIG.photoCaption || CONFIG.name;
  back.textContent = CONFIG.photoBack || "Happy birthday! 💛";
  fig.hidden  = false;
  hint.hidden = false;

  const flip = () => {
    fig.classList.toggle("flipped");
    if (audioReady()) {
      pluck(fig.classList.contains("flipped") ? 79 : 72,
            ctx.currentTime, 0.4, 0.15, "triangle", sfxBus);
    }
  };
  fig.addEventListener("click", flip);
  fig.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); flip(); }
  });
})();

/* ---------------- Wishes / apology deck ---------------- */
(function initNotes() {
  const list = CONFIG.notes || [];
  if (list.length < 1) return;
  const box  = $("#notes");
  const txt  = $("#noteText");
  const dots = $("#noteDots");
  let idx = 0;

  $("#notesHeading").textContent = CONFIG.notesTitle || "For you";
  list.forEach((_, i) => {
    const d = document.createElement("i");
    if (i === 0) d.className = "on";
    dots.appendChild(d);
  });

  function show(i) {
    idx = (i + list.length) % list.length;
    txt.classList.add("fade");
    setTimeout(() => {
      txt.textContent = list[idx];
      txt.classList.remove("fade");
      [...dots.children].forEach((d, k) => d.classList.toggle("on", k === idx));
    }, reduceMotion ? 0 : 200);
    if (audioReady()) pluck(SCALE[idx % SCALE.length] + 12, ctx.currentTime, 0.4, 0.14, "sine", sfxBus);
  }
  txt.textContent = list[0];
  box.hidden = false;

  $("#notePrev").addEventListener("click", () => show(idx - 1));
  $("#noteNext").addEventListener("click", () => show(idx + 1));

  /* swipe on mobile */
  let x0 = null;
  box.addEventListener("touchstart", (e) => { x0 = e.touches[0].clientX; }, { passive: true });
  box.addEventListener("touchend",   (e) => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0;
    if (Math.abs(dx) > 40) show(dx < 0 ? idx + 1 : idx - 1);
    x0 = null;
  });
})();

/* ---------------- Gift boxes ---------------- */
(function initGifts() {
  const list = CONFIG.gifts || [];
  if (!list.length) return;
  const box  = $("#gifts");
  const row  = $("#giftsRow");
  box.hidden = false;

  list.forEach((g) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "gbox";
    b.setAttribute("aria-label", "Open gift " + (row.children.length + 1));
    b.textContent = "🎁";
    b.addEventListener("click", () => {
      if (b.classList.contains("opened")) return;
      b.classList.add("opened");
      b.setAttribute("aria-label", g.note);
      b.innerHTML = '<div><div style="font-size:1.4rem">' + g.emoji + '</div>' +
                    '<div class="gbox-note">' + g.note + '</div></div>';
      if (audioReady()) {
        pluck(SCALE[(Math.random() * SCALE.length) | 0] + 7, ctx.currentTime, 0.5, 0.2, "triangle", sfxBus);
      }
      const r = b.getBoundingClientRect();
      burst(r.left + r.width / 2, r.top + r.height / 2, 18,
            { spread: Math.PI * 2, colors: ["#FFE27A", "#FF6FA5", "#fff"] });
    });
    row.appendChild(b);
  });
})();

/* ---------------- Wish input ---------------- */
const WISH_KEY = "muskan.wish.v1";
(function initWish() {
  const input = $("#wishIn");
  const save  = $("#wishSave");
  const shown = $("#wishSaved");
  let saved = "";
  try { saved = localStorage.getItem(WISH_KEY) || ""; } catch {}
  if (saved) {
    input.value = saved;
    shown.textContent = "Your wish: " + saved;
    shown.hidden = false;
  }
  save.addEventListener("click", () => {
    const v = input.value.trim();
    if (!v) { input.focus(); return; }
    try { localStorage.setItem(WISH_KEY, v); } catch {}
    shown.textContent = "Your wish: " + v;
    shown.hidden = false;
    if (audioReady()) {
      [72, 76, 79].forEach((m, i) => pluck(m, ctx.currentTime + i * 0.08, 0.6, 0.22, "triangle", sfxBus));
    }
    const r = save.getBoundingClientRect();
    burst(r.left + r.width / 2, r.top, 25, { spread: Math.PI * 1.2, colors: ["#B9A4FF", "#FFE27A", "#fff"] });
  });
})();

/* ---------------- Fullscreen ---------------- */
$("#fsBtn").addEventListener("click", async () => {
  const el = document.documentElement;
  try {
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
      const req = el.requestFullscreen || el.webkitRequestFullscreen;
      if (req) await req.call(el);
    } else {
      const exit = document.exitFullscreen || document.webkitExitFullscreen;
      if (exit) await exit.call(document);
    }
  } catch { /* not supported / blocked */ }
});

/* ---------------- Start ---------------- */
$("#msg").textContent  = CONFIG.message;
$("#sign").textContent = CONFIG.from ? "With love, " + CONFIG.from : "";
renderHeading();
spawnBalloons();
</script>
