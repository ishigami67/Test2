<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FFE4EF;
    --dot: #FFD0E3;
    --ink: #5B2A57;
    --berry: #FF6FA5;
    --lav: #B9A4FF;
    --butter: #FFE27A;
    --mint: #9BEBD0;
    --sky: #8FD3FF;
    --white: #FFFFFF;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100svh;
    background-color: var(--bg);
    background-image: radial-gradient(var(--dot) 3px, transparent 3.5px);
    background-size: 38px 38px;
    color: var(--ink);
    font-family: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
    overflow-x: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

  /* ---------- Gate (gift screen) ---------- */
  .gate {
    position: fixed; inset: 0; z-index: 50;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 24px; text-align: center;
    background-color: var(--bg);
    background-image: radial-gradient(var(--dot) 3px, transparent 3.5px);
    background-size: 38px 38px;
    transition: opacity .5s ease;
  }
  .gate.gone { opacity: 0; pointer-events: none; }
  .gate-title { margin: 0; font-size: clamp(1.5rem, 6vw, 2.2rem); font-weight: 600; max-width: 18ch; line-height: 1.15; }
  .gift {
    width: min(58vw, 240px); background: none; border: 0; padding: 0; cursor: pointer;
    animation: wiggle 2.6s ease-in-out infinite;
  }
  .gift svg { width: 100%; height: auto; display: block; overflow: visible; }
  .gift .lid { transform-box: fill-box; transform-origin: center; transition: transform .6s cubic-bezier(.3,1.5,.5,1), opacity .6s ease; }
  .gate.opened .gift { animation: none; }
  .gate.opened .lid { transform: translateY(-60px) rotate(-16deg); opacity: 0; }
  @keyframes wiggle {
    0%, 70%, 100% { transform: rotate(0); }
    76% { transform: rotate(-5deg); }
    82% { transform: rotate(5deg); }
    88% { transform: rotate(-3deg); }
    94% { transform: rotate(3deg); }
  }

  /* ---------- Buttons ---------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 10px 20px; border-radius: 999px; cursor: pointer;
    background: var(--white); border: 3px solid var(--ink);
    box-shadow: 0 4px 0 var(--ink);
    font-weight: 600; font-size: 1rem; line-height: 1.2;
    transition: transform .08s ease, box-shadow .08s ease;
  }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 5px 0 var(--ink); }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
  .btn.primary { background: var(--butter); }
  .btn.big { font-size: 1.25rem; padding: 12px 28px; }

  .sound {
    position: fixed; z-index: 20;
    top: calc(12px + env(safe-area-inset-top, 0px)); right: 12px;
    padding: 8px 14px; font-size: .9rem;
  }
  .sound svg { width: 18px; height: 18px; }
  .sound[aria-pressed="false"] svg .wave { display: none; }

  /* ---------- Layout ---------- */
  main {
    position: relative; z-index: 2;
    display: flex; flex-direction: column; align-items: center; gap: 14px;
    padding: calc(56px + env(safe-area-inset-top, 0px)) 16px calc(40px + env(safe-area-inset-bottom, 0px));
    text-align: center;
    pointer-events: none;
  }
  main > * { pointer-events: auto; }

  h1 { margin: 0; line-height: 1; font-weight: 700; }
  .line { display: block; }
  .line.small { font-size: clamp(2rem, 9vw, 3.4rem); }
  .line.name { font-size: clamp(3.2rem, 17vw, 7rem); word-break: break-word; }
  .ch {
    display: inline-block; cursor: pointer; opacity: 0; user-select: none;
    text-shadow: 0 3px 0 #fff, 0 -2px 0 #fff, 2px 0 0 #fff, -2px 0 0 #fff, 2px 2px 0 #fff, -2px -2px 0 #fff, 2px -2px 0 #fff, -2px 2px 0 #fff;
  }
  body.ready .ch { animation: drop .6s cubic-bezier(.3,1.6,.5,1) both; animation-delay: var(--d, 0s); }
  @keyframes drop {
    from { opacity: 0; transform: translateY(-50px) scale(.5) rotate(-12deg); }
    to   { opacity: 1; transform: none; }
  }

  /* ---------- Cake ---------- */
  .cake-wrap { width: min(88vw, 380px); }
  #cake { width: 100%; height: auto; display: block; overflow: visible; }
  .candle { cursor: pointer; outline: none; }
  .candle .hit { stroke: transparent; stroke-width: 3; }
  .candle:focus-visible .hit { stroke: var(--ink); stroke-dasharray: 6 5; }
  .flick { transform-box: fill-box; transform-origin: 50% 100%; animation: flicker .5s ease-in-out infinite alternate; transition: opacity .2s ease, transform .2s ease; }
  @keyframes flicker { from { transform: scale(1, 1) rotate(-3deg); } to { transform: scale(.92, 1.1) rotate(3deg); } }
  .candle.out .flick { animation: none; opacity: 0; transform: scale(.2); }
  .puff { opacity: 0; fill: #fff; stroke: var(--ink); stroke-width: 2; }
  .candle.out .puff { animation: smoke 1.4s ease-out; }
  @keyframes smoke {
    0% { opacity: .95; transform: translateY(0) scale(.6); }
    100% { opacity: 0; transform: translateY(-34px) scale(1.5); }
  }
  .eyes-happy, .mouth-big { display: none; }
  #cake.done .eyes-open, #cake.done .mouth-small { display: none; }
  #cake.done .eyes-happy, #cake.done .mouth-big { display: block; }

  .status { margin: 0; font-size: 1.1rem; font-weight: 500; min-height: 1.5em; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }

  /* ---------- Wish card ---------- */
  .wish {
    max-width: 420px; padding: 18px 24px 20px;
    background: var(--white); border: 3px solid var(--ink); border-radius: 26px;
    box-shadow: 7px 7px 0 var(--lav); transform: rotate(-1.5deg);
  }
  .wish[hidden] { display: none; }
  .wish h2 { margin: 0 0 6px; font-size: 1.6rem; font-weight: 700; }
  .wish p { margin: 0; font-size: 1.1rem; line-height: 1.45; }
  .wish .sign { margin-top: 10px; font-weight: 600; color: #E8478A; }

  .namebox { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center; font-weight: 500; }
  .namebox input {
    width: 11rem; padding: 8px 16px; border-radius: 999px; background: var(--white);
    border: 3px solid var(--ink); text-align: center;
  }
  .tiny { margin: 0; font-size: .95rem; opacity: .8; }

  /* ---------- Balloons ---------- */
  .sky { position: fixed; inset: 0; z-index: 1; overflow: hidden; pointer-events: none; }
  .balloon {
    position: absolute; bottom: -190px; pointer-events: auto; cursor: pointer;
    animation: rise linear infinite;
  }
  @keyframes rise {
    from { transform: translateY(0); }
    to   { transform: translateY(calc(-100vh - 380px)); }
  }
  .sway { display: block; position: relative; animation: sway 4.5s ease-in-out infinite alternate; transform-origin: 50% 100%; }
  @keyframes sway {
    from { transform: translateX(-14px) rotate(-4deg); }
    to   { transform: translateX(14px) rotate(4deg); }
  }
  .bbody {
    display: block; position: relative;
    width: var(--s); height: calc(var(--s) * 1.2);
    background: var(--c); border: 3px solid var(--ink);
    border-radius: 50% 50% 46% 46%;
    box-shadow: inset -8px -10px 0 rgba(91, 42, 87, .12);
  }
  .bbody::before {
    content: ""; position: absolute; top: 14%; left: 20%; width: 18%; height: 26%;
    background: rgba(255,255,255,.75); border-radius: 50%; transform: rotate(25deg);
  }
  .bbody::after {
    content: ""; position: absolute; left: 50%; bottom: -9px; width: 12px; height: 12px;
    background: var(--c); border: 3px solid var(--ink); border-top: 0; border-left: 0;
    transform: translateX(-50%) rotate(45deg) scale(.8);
  }
  .sway::after {
    content: ""; display: block; width: 2px; height: 70px; margin: 8px auto 0; background: var(--ink); opacity: .6;
  }

  /* ---------- Confetti + hearts ---------- */
  #confetti { position: fixed; inset: 0; z-index: 40; pointer-events: none; }
  .heart {
    position: fixed; z-index: 45; pointer-events: none; font-size: 24px; line-height: 1;
    font-family: system-ui, sans-serif; font-variant-emoji: text;
    animation: floatUp 1.3s ease-out forwards;
  }
  @keyframes floatUp {
    from { opacity: 1; transform: translate(-50%, -50%) scale(.6); }
    to   { opacity: 0; transform: translate(calc(-50% + var(--dx)), calc(-50% - 100px)) scale(1.3); }
  }

  @media (prefers-reduced-motion: reduce) {
    .gift, .flick, .sway { animation: none; }
    .ch { opacity: 1 !important; animation: none !important; }
    .balloon { animation: none; bottom: var(--rest, 30%); }
    .candle.out .puff { animation: none; }
  }
</style>
</head>
<body>

<!-- Gift screen: the tap that opens it also unlocks the music -->

<script>
/* ================= EDIT ME ================= */
const CONFIG = {
  name: "Bestie",
  message: "Another year older, another year more wonderful. I hope your day is full of cake, laughter, and everything you love most.",
  from: ""   // e.g. "Riya" -> shows "With love, Riya"
};
/* Tip: you can also share links like  birthday.html?name=Riya&from=Aman  */
/* =========================================== */

const $ = (s) => document.querySelector(s);
const params = new URLSearchParams(location.search);
if (params.get("name")) CONFIG.name = params.get("name").slice(0, 18);
if (params.get("from")) CONFIG.from = params.get("from").slice(0, 30);
if (params.get("msg"))  CONFIG.message = params.get("msg").slice(0, 300);

const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const LETTER_COLORS = ["#E8478A", "#7C5CF0", "#F07A2E", "#1FAE86", "#2E9BE8"];
const CONFETTI_COLORS = ["#FF6FA5", "#B9A4FF", "#FFE27A", "#9BEBD0", "#8FD3FF", "#FFA24D", "#FFFFFF"];
const SCALE = [72, 74, 76, 79, 81, 84, 86];

/* ---------------- Heading letters ---------------- */
function splitLetters(el, text, offset) {
  el.textContent = "";
  [...text].forEach((c, i) => {
    const s = document.createElement("span");
    s.className = "ch";
    s.textContent = c === " " ? "\u00A0" : c;
    s.style.color = LETTER_COLORS[(i + offset) % LETTER_COLORS.length];
    s.style.setProperty("--d", ((i + offset) * 0.035) + "s");
    s.dataset.n = String(i + offset);
    el.appendChild(s);
  });
}
function renderTitle() {
  const name = ($("#nameIn").value.trim() || CONFIG.name);
  splitLetters($("#line1"), "Happy Birthday", 0);
  splitLetters($("#line2"), name + "!", 14);
  $("#title").setAttribute("aria-label", "Happy Birthday, " + name);
  $("#gateTitle").textContent = "A little surprise is waiting for " + name;
  $("#sign").textContent = CONFIG.from ? "With love, " + CONFIG.from : "";
}
function hop(el) {
  if (reduceMotion || !el.animate) return;
  el.animate(
    [{ transform: "translateY(0) rotate(0)" },
     { transform: "translateY(-16px) rotate(-8deg)" },
     { transform: "translateY(0) rotate(0)" }],
    { duration: 450, easing: "ease-out" }
  );
}
function letterPlay(el) {
  hop(el);
  if (audioReady()) pluck(SCALE[Number(el.dataset.n) % SCALE.length], ctx.currentTime, 0.9, 0.3, "triangle", sfxBus);
}
$("#title").addEventListener("pointerover", (e) => {
  const ch = e.target.closest(".ch");
  if (ch && e.pointerType === "mouse" && !ch.contains(e.relatedTarget)) letterPlay(ch);
});
$("#title").addEventListener("pointerdown", (e) => {
  const ch = e.target.closest(".ch");
  if (ch && e.pointerType !== "mouse") letterPlay(ch);
});

/* ---------------- Audio (all synthesized, no files needed) ---------------- */
let ctx = null, master = null, musicBus = null, sfxBus = null, noiseBuf = null;
let musicOn = true, loopTimer = null;

function initAudio() {
  if (ctx) { if (ctx.state === "suspended") ctx.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  ctx = new AC();
  master = ctx.createGain(); master.gain.value = 0.9; master.connect(ctx.destination);
  musicBus = ctx.createGain(); musicBus.gain.value = 0.55; musicBus.connect(master);
  sfxBus = ctx.createGain(); sfxBus.gain.value = 1; sfxBus.connect(master);
  noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
}
function audioReady() { return !!ctx && ctx.state !== "closed"; }

function pluck(midi, t, dur, vol, type, bus) {
  const f = 440 * Math.pow(2, (midi - 69) / 12);
  const o1 = ctx.createOscillator(), o2 = ctx.createOscillator();
  const g = ctx.createGain(), g2 = ctx.createGain();
  o1.type = type || "sine"; o1.frequency.value = f;
  o2.type = "sine"; o2.frequency.value = f * 2; g2.gain.value = 0.25;
  o1.connect(g); o2.connect(g2); g2.connect(g); g.connect(bus || musicBus);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o1.start(t); o2.start(t); o1.stop(t + dur + 0.05); o2.stop(t + dur + 0.05);
}

/* The birthday tune, in a gentle music-box voice. [midi note, beats] */
const MELODY = [
  [67,.75],[67,.25],[69,1],[67,1],[72,1],[71,2],
  [67,.75],[67,.25],[69,1],[67,1],[74,1],[72,2],
  [67,.75],[67,.25],[79,1],[76,1],[72,1],[71,1],[69,1],
  [77,.75],[77,.25],[76,1],[72,1],[74,1],[72,2]
];
const CHORDS = {
  C: [48, 52, 55], G: [43, 59, 62], F: [41, 57, 60]
};
const BARS = ["C", "G", "G", "C", "C", "F", "G", "C"];
const BEAT = 0.56;

function scheduleSong(t0) {
  let t = t0;
  MELODY.forEach(([m, b]) => {
    pluck(m, t, Math.max(b * BEAT * 1.7, 0.45), 0.24, "triangle", musicBus);
    t += b * BEAT;
  });
  BARS.forEach((name, i) => {
    const bt = t0 + (1 + i * 3) * BEAT;
    const [bass, c1, c2] = CHORDS[name];
    pluck(bass, bt, 1.5, 0.2, "sine", musicBus);
    pluck(c1, bt + BEAT, 0.8, 0.1, "sine", musicBus);
    pluck(c2, bt + BEAT * 2, 0.8, 0.1, "sine", musicBus);
  });
  return (25 + 3) * BEAT; // song + a short pause before it loops
}
function startMusic() {
  if (!audioReady() || loopTimer) return;
  const run = () => {
    const len = scheduleSong(ctx.currentTime + 0.08);
    loopTimer = setTimeout(run, len * 1000);
  };
  run();
}
function setMusic(on) {
  musicOn = on;
  $("#soundBtn").setAttribute("aria-pressed", String(on));
  $("#soundLabel").textContent = on ? "Music on" : "Music off";
  if (audioReady()) master.gain.setTargetAtTime(on ? 0.9 : 0, ctx.currentTime, 0.05);
}
function noise(t, dur, type, freq, vol) {
  const src = ctx.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
  const f = ctx.createBiquadFilter(); f.type = type; f.frequency.value = freq;
  const g = ctx.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(f); f.connect(g); g.connect(sfxBus);
  src.start(t); src.stop(t + dur + 0.05);
}
function sfxPop() {
  if (!audioReady()) return;
  const t = ctx.currentTime;
  noise(t, 0.12, "highpass", 1800, 0.7);
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = "sine"; o.frequency.setValueAtTime(520, t); o.frequency.exponentialRampToValueAtTime(120, t + 0.12);
  g.gain.setValueAtTime(0.35, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.14);
  o.connect(g); g.connect(sfxBus); o.start(t); o.stop(t + 0.16);
}
function sfxBlow() {
  if (!audioReady()) return;
  const t = ctx.currentTime;
  noise(t, 0.45, "lowpass", 900, 0.5);
}
function sfxFanfare() {
  if (!audioReady()) return;
  const t = ctx.currentTime;
  [72, 76, 79, 84, 88].forEach((m, i) => pluck(m, t + i * 0.1, 0.9, 0.3, "triangle", sfxBus));
}
function sfxPopper() {
  if (!audioReady()) return;
  const t = ctx.currentTime;
  noise(t, 0.18, "bandpass", 1200, 0.8);
  pluck(88, t + 0.05, 0.5, 0.2, "triangle", sfxBus);
}

/* ---------------- Confetti ---------------- */
const cv = $("#confetti"), cx = cv.getContext("2d");
let parts = [], raf = 0;
function sizeCanvas() { cv.width = innerWidth; cv.height = innerHeight; }
sizeCanvas(); addEventListener("resize", sizeCanvas);

function burst(x, y, n, opts) {
  opts = opts || {};
  const angle = opts.angle !== undefined ? opts.angle : -Math.PI / 2;
  const spread = opts.spread !== undefined ? opts.spread : Math.PI * 1.1;
  const colors = opts.colors || CONFETTI_COLORS;
  const count = reduceMotion ? Math.round(n * 0.3) : n;
  for (let i = 0; i < count; i++) {
    const a = angle + (Math.random() - 0.5) * spread;
    const v = 5 + Math.random() * 9;
    parts.push({
      x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v,
      w: 6 + Math.random() * 7, h: 4 + Math.random() * 6,
      rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.4,
      color: colors[(Math.random() * colors.length) | 0],
      round: Math.random() < 0.3, life: 110 + Math.random() * 60
    });
  }
  if (!raf) raf = requestAnimationFrame(tick);
}
function tick() {
  cx.clearRect(0, 0, cv.width, cv.height);
  parts = parts.filter((p) => p.life > 0 && p.y < cv.height + 40);
  for (const p of parts) {
    p.vy += 0.2; p.vx *= 0.985; p.vy *= 0.985;
    p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life--;
    cx.save();
    cx.globalAlpha = Math.min(1, p.life / 30);
    cx.translate(p.x, p.y); cx.rotate(p.rot);
    cx.fillStyle = p.color;
    if (p.round) { cx.beginPath(); cx.arc(0, 0, p.w / 2, 0, 6.28); cx.fill(); }
    else cx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
    cx.restore();
  }
  raf = parts.length ? requestAnimationFrame(tick) : 0;
  if (!parts.length) cx.clearRect(0, 0, cv.width, cv.height);
}

/* ---------------- Balloons ---------------- */
const sky = $("#sky");
const BALLOON_COLORS = ["#FF6FA5", "#B9A4FF", "#FFE27A", "#9BEBD0", "#8FD3FF", "#FFA24D"];
function makeBalloon(initial) {
  const b = document.createElement("div");
  b.className = "balloon";
  const color = BALLOON_COLORS[(Math.random() * BALLOON_COLORS.length) | 0];
  const size = 58 + Math.random() * 32;
  const dur = 15 + Math.random() * 11;
  b.dataset.color = color;
  b.style.setProperty("--c", color);
  b.style.setProperty("--s", size + "px");
  b.style.left = (3 + Math.random() * 86) + "%";
  b.style.setProperty("--rest", (8 + Math.random() * 60) + "%");
  b.style.animationDuration = dur + "s";
  b.style.animationDelay = initial ? (-Math.random() * dur) + "s" : (Math.random() * 2) + "s";
  const sway = document.createElement("span");
  sway.className = "sway";
  sway.style.animationDuration = (3.5 + Math.random() * 2.5) + "s";
  const body = document.createElement("span");
  body.className = "bbody";
  sway.appendChild(body); b.appendChild(sway);
  sky.appendChild(b);
}
function spawnBalloons() {
  const n = innerWidth < 600 ? 6 : 9;
  for (let i = 0; i < n; i++) makeBalloon(true);
}
sky.addEventListener("pointerdown", (e) => {
  const b = e.target.closest(".balloon");
  if (!b) return;
  const r = b.getBoundingClientRect();
  const color = b.dataset.color;
  burst(r.left + r.width / 2, r.top + r.height * 0.35, 36,
        { spread: Math.PI * 2, colors: [color, "#fff", "#FFE27A"] });
  sfxPop();
  if (audioReady()) pluck(SCALE[(Math.random() * SCALE.length) | 0], ctx.currentTime + 0.04, 0.7, 0.2, "triangle", sfxBus);
  b.remove();
  setTimeout(() => makeBalloon(false), 900);
});

/* ---------------- Cake + candles ---------------- */
const cake = $("#cake");
const candles = [...document.querySelectorAll(".candle")];
const statusEl = $("#status");
let celebrated = false;

function setCandleLabel(c, out) {
  const n = Number(c.dataset.i) + 1;
  c.setAttribute("aria-label", out ? "Candle " + n + ", blown out" : "Candle " + n + ", lit. Press to blow it out");
}
function blow(c) {
  if (c.classList.contains("out")) return;
  c.classList.add("out");
  setCandleLabel(c, true);
  sfxBlow();
  refresh();
}
function refresh() {
  const lit = candles.filter((c) => !c.classList.contains("out")).length;
  if (lit === 0) {
    if (!celebrated) { celebrated = true; celebrate(); }
  } else {
    celebrated = false;
    cake.classList.remove("done");
    $("#wish").hidden = true;
    statusEl.textContent = lit === 3 ? "Tap each candle to blow it out"
      : lit + (lit === 1 ? " candle left" : " candles left");
  }
}
function celebrate() {
  cake.classList.add("done");
  statusEl.textContent = "All out! Make a wish.";
  sfxFanfare();
  const w = innerWidth, h = innerHeight;
  burst(w * 0.5, h * 0.35, 120, { spread: Math.PI * 2 });
  burst(0, h, 70, { angle: -Math.PI / 3, spread: Math.PI / 3 });
  burst(w, h, 70, { angle: -2 * Math.PI / 3, spread: Math.PI / 3 });
  const wish = $("#wish");
  wish.hidden = false;
  if (!reduceMotion && wish.animate) {
    wish.animate(
      [{ opacity: 0, transform: "translateY(24px) rotate(-1.5deg) scale(.9)" },
       { opacity: 1, transform: "translateY(0) rotate(-1.5deg) scale(1)" }],
      { duration: 450, easing: "cubic-bezier(.3,1.5,.5,1)" }
    );
  }
  wish.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "nearest" });
}
candles.forEach((c) => {
  c.addEventListener("click", () => blow(c));
  c.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); blow(c); }
  });
});
$("#blowAll").addEventListener("click", () => {
  candles.filter((c) => !c.classList.contains("out")).forEach((c, i) => setTimeout(() => blow(c), i * 220));
});
$("#relight").addEventListener("click", () => {
  candles.forEach((c) => { c.classList.remove("out"); setCandleLabel(c, false); });
  refresh();
});
$("#popper").addEventListener("click", (e) => {
  const w = innerWidth, h = innerHeight;
  sfxPopper();
  burst(w * 0.1, h * 0.95, 60, { angle: -Math.PI / 3, spread: Math.PI / 3 });
  burst(w * 0.9, h * 0.95, 60, { angle: -2 * Math.PI / 3, spread: Math.PI / 3 });
});

/* ---------------- Hearts on tap ---------------- */
const HEART_COLORS = ["#E8478A", "#7C5CF0", "#F07A2E", "#1FAE86", "#2E9BE8"];
document.addEventListener("pointerdown", (e) => {
  if (reduceMotion || document.body.classList.contains("ready") === false) return;
  if (e.target.closest("button, input, label, .candle, .balloon, .ch, .wish, .gate")) return;
  const h = document.createElement("span");
  h.className = "heart";
  h.textContent = "\u2665";
  h.style.left = e.clientX + "px";
  h.style.top = e.clientY + "px";
  h.style.color = HEART_COLORS[(Math.random() * HEART_COLORS.length) | 0];
  h.style.setProperty("--dx", ((Math.random() - 0.5) * 60) + "px");
  document.body.appendChild(h);
  h.addEventListener("animationend", () => h.remove());
  if (audioReady()) pluck(SCALE[(Math.random() * SCALE.length) | 0] + 12, ctx.currentTime, 0.5, 0.12, "sine", sfxBus);
});

/* ---------------- Gift gate + sound toggle ---------------- */
let opened = false;
function openGift() {
  if (opened) return;
  opened = true;
  initAudio();
  startMusic();
  setMusic(true);
  $("#gate").classList.add("opened");
  sfxFanfare();
  burst(innerWidth / 2, innerHeight * 0.5, 130, { spread: Math.PI * 2 });
  setTimeout(() => {
    $("#gate").classList.add("gone");
    document.body.classList.add("ready");
    setTimeout(() => { $("#gate").hidden = true; }, 600);
  }, reduceMotion ? 0 : 900);
}
$("#openBtn").addEventListener("click", openGift);
$("#giftBtn").addEventListener("click", openGift);
$("#soundBtn").addEventListener("click", () => {
  if (!audioReady()) { initAudio(); startMusic(); }
  setMusic(!musicOn);
});

$("#nameIn").addEventListener("input", renderTitle);

/* ---------------- Start ---------------- */
$("#nameIn").value = CONFIG.name;
$("#msg").textContent = CONFIG.message;
renderTitle();
spawnBalloons();
</script>
</body>
